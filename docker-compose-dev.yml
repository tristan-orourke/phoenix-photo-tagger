services:
  dev_app:
    build: .
    ports:
      - 4001:4000
    volumes:
      - ./app:/app
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
    depends_on:
      - dev_db
    working_dir: /app
    command: bash -c "mix setup && mix phx.server"
    # user: "1000:1000"
  dev_db:
    image: postgres:17.0
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
    - dev_database:/var/lib/postgresql/data

volumes:
  dev_database:

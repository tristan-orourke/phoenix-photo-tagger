services:
  app:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/priv/static/uploads
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
    depends_on:
      - db
    working_dir: /app
    command: bash -c "mix ecto.setup && mix phx.server"
    # user: "1000:1000"
  db:
    image: postgres:17.0
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
    - "database:/var/lib/postgresql/data"

volumes:
  database:
  uploads:

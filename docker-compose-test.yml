services:
  dev_app:
    image: phoenix-github:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=dev_db
      - MIX_ENV=test
    depends_on:
      - dev_db
    working_dir: /app
    volumes:
      - ./app:/app
  dev_db:
    image: postgres:17.0
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
    - dev_database:/var/lib/postgresql/data

volumes:
  dev_database:
